services:
  - type: web
    name: farm-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    domains:
      - dashboard.cwrtmalle.co.uk

databases:
  - name: farm-dashboard-db
    plan: basic-1gb
    databaseName: farm_dashboard
    user: farm_dashboard

services:
  - type: web
    name: farm-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: farm-dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_DRIVE_USER_EMAIL
        sync: false
      - key: HERD_EXPORT_BASE_PATH
        sync: false
      - key: IMPORT_API_KEY
        sync: false
      - key: FEEDLYNC_REFRESH_TOKEN
        sync: false
      - key: FEEDLYNC_FARM_ID
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DOCUSEAL_API_KEY
        sync: false
      - key: DOCUSEAL_WEBHOOK_SECRET
        sync: false
      - key: HR_ENCRYPTION_KEY
        sync: false
      - key: HR_HR_TEAM_EMAILS
        sync: false
      - key: CONTRACTS_STORAGE_DIR
        value: /var/data/contracts
      - key: DOCUSEAL_CWRTMALLE_TEMPLATE_ID
        sync: false
      - key: DOCUSEAL_CWRTMALLE_TEMPLATE_NAME
        sync: false
    domains:
      - dashboard.cwrtmalle.co.uk

databases:
  - name: farm-dashboard-db
    plan: basic-1gb
    databaseName: farm_dashboard
    user: farm_dashboard

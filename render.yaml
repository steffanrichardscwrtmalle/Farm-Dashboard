services:
  - type: web
    name: farm-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: farm-dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_DRIVE_USER_EMAIL
        sync: false
      - key: HERD_EXPORT_BASE_PATH
        sync: false
      - key: IMPORT_API_KEY
        sync: false
      - key: FEEDLYNC_REFRESH_TOKEN
        sync: false
      - key: FEEDLYNC_FARM_ID
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DOCUSEAL_API_KEY
        sync: false
      - key: DOCUSEAL_WEBHOOK_SECRET
        sync: false
      - key: HR_ENCRYPTION_KEY
        sync: false
      - key: HR_HR_TEAM_EMAILS
        sync: false
      - key: DOCUSEAL_CM_HR_TEAM_EMAILS
        sync: false
      - key: DOCUSEAL_GAD_HR_TEAM_EMAILS
        sync: false
      - key: CONTRACTS_STORAGE_DIR
        value: /var/data/contracts
      - key: DOCUSEAL_CWRTMALLE_TEMPLATE_ID
        sync: false
      - key: DOCUSEAL_CWRTMALLE_TEMPLATE_NAME
        sync: false
      - key: DOCUSEAL_GREENACRE_TEMPLATE_ID
        sync: false
      - key: DOCUSEAL_GREENACRE_TEMPLATE_NAME
        sync: false
      - key: DOCUSEAL_EMAIL_SUBJECT
        sync: false
      - key: DOCUSEAL_EMAIL_BODY
        sync: false
      - key: DOCUSEAL_CWRTMALLE_EMAIL_SUBJECT
        sync: false
      - key: DOCUSEAL_CWRTMALLE_EMAIL_BODY
        sync: false
      - key: DOCUSEAL_GREENACRE_EMAIL_SUBJECT
        sync: false
      - key: DOCUSEAL_GREENACRE_EMAIL_BODY
        sync: false
    domains:
      - dashboard.cwrtmalle.co.uk

  # Daily email import: haulier collections, NML results, buyer statements.
  # Schedule is UTC (6:00 UTC ≈ 7:00 BST). Env vars mirror the web service.
  - type: cron
    name: farm-dashboard-milk-daily
    runtime: docker
    schedule: "0 6 * * *"
    dockerCommand: python scripts/import_milk_daily.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: MILK_CRON_LOOKBACK_DAYS
        value: "2"
      - key: GRAPH_TENANT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID
      - key: GRAPH_CLIENT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID
      - key: GRAPH_CLIENT_SECRET
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET
      - key: GRAPH_DRIVE_USER_EMAIL
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_DRIVE_USER_EMAIL
      - key: GRAPH_TENANT_ID_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID_CM
      - key: GRAPH_CLIENT_ID_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID_CM
      - key: GRAPH_CLIENT_SECRET_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET_CM

databases:
  - name: farm-dashboard-db
    plan: basic-1gb
    databaseName: farm_dashboard
    user: farm_dashboard

services:
  - type: web
    name: farm-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: farm-dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_DRIVE_USER_EMAIL
        sync: false
      - key: HERD_EXPORT_BASE_PATH
        sync: false
      - key: IMPORT_API_KEY
        sync: false
      - key: FEEDLYNC_REFRESH_TOKEN
        sync: false
      - key: FEEDLYNC_FARM_ID
        sync: false
      - key: SENSEHUB_USERNAME
        sync: false
      - key: SENSEHUB_PASSWORD
        sync: false
      - key: SENSEHUB_FARM_ID
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DOCUSEAL_API_KEY
        sync: false
      - key: DOCUSEAL_WEBHOOK_SECRET
        sync: false
      - key: HR_ENCRYPTION_KEY
        sync: false
      - key: HR_HR_TEAM_EMAILS
        sync: false
      - key: DOCUSEAL_CM_HR_TEAM_EMAILS
        sync: false
      - key: DOCUSEAL_GAD_HR_TEAM_EMAILS
        sync: false
      - key: CONTRACTS_STORAGE_DIR
        value: /var/data/contracts
      - key: DOCUSEAL_CWRTMALLE_TEMPLATE_ID
        sync: false
      - key: DOCUSEAL_CWRTMALLE_TEMPLATE_NAME
        sync: false
      - key: DOCUSEAL_GREENACRE_TEMPLATE_ID
        sync: false
      - key: DOCUSEAL_GREENACRE_TEMPLATE_NAME
        sync: false
      - key: DOCUSEAL_EMAIL_SUBJECT
        sync: false
      - key: DOCUSEAL_EMAIL_BODY
        sync: false
      - key: DOCUSEAL_CWRTMALLE_EMAIL_SUBJECT
        sync: false
      - key: DOCUSEAL_CWRTMALLE_EMAIL_BODY
        sync: false
      - key: DOCUSEAL_GREENACRE_EMAIL_SUBJECT
        sync: false
      - key: DOCUSEAL_GREENACRE_EMAIL_BODY
        sync: false
      - key: CTS_DDTS_USERNAME
        sync: false
      - key: CTS_DDTS_PASSWORD
        sync: false
      - key: CTS_CTWS_USERNAME_CM
        sync: false
      - key: CTS_CTWS_PASSWORD_CM
        sync: false
      - key: CTS_HOLDING_CM
        sync: false
      - key: CTS_CTWS_USERNAME_GAD
        sync: false
      - key: CTS_CTWS_PASSWORD_GAD
        sync: false
      - key: CTS_HOLDING_GAD
        sync: false
    domains:
      - dashboard.cwrtmalle.co.uk

  # Daily email import: haulier, NML, statements, and cattle remittances.
  # Schedule is UTC (6:00 UTC ≈ 7:00 BST). Env vars mirror the web service.
  - type: cron
    name: farm-dashboard-emails-daily
    runtime: docker
    schedule: "0 6 * * *"
    dockerCommand: python scripts/import_milk_daily.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: MILK_CRON_LOOKBACK_DAYS
        value: "2"
      - key: GRAPH_TENANT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID
      - key: GRAPH_CLIENT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID
      - key: GRAPH_CLIENT_SECRET
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET
      - key: GRAPH_DRIVE_USER_EMAIL
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_DRIVE_USER_EMAIL
      - key: GRAPH_TENANT_ID_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID_CM
      - key: GRAPH_CLIENT_ID_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID_CM
      - key: GRAPH_CLIENT_SECRET_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET_CM

  # Parlour / Dataflow milk-flow email import at 1am, 9am, and 5pm UK time.
  # Runs hourly (UTC); the script exits immediately unless Europe/London hour
  # is 1, 9, or 17 — so BST/GMT stay correct year-round.
  - type: cron
    name: farm-dashboard-parlour-import
    runtime: docker
    schedule: "5 * * * *"
    dockerCommand: python scripts/import_parlour_milk_flow.py --only-at-uk-hours 1,9,17 --days 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: MILK_CRON_LOOKBACK_DAYS
        value: "2"
      - key: GRAPH_TENANT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID
      - key: GRAPH_CLIENT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID
      - key: GRAPH_CLIENT_SECRET
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET
      - key: GRAPH_DRIVE_USER_EMAIL
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_DRIVE_USER_EMAIL
      - key: GRAPH_TENANT_ID_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID_CM
      - key: GRAPH_CLIENT_ID_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID_CM
      - key: GRAPH_CLIENT_SECRET_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET_CM

  # SenseHub young-stock health: hourly live reading, locked at 0/6/12/18 UK.
  - type: cron
    name: farm-dashboard-sensehub-youngstock
    runtime: docker
    schedule: "10 * * * *"
    dockerCommand: python scripts/import_sensehub_youngstock.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SENSEHUB_USERNAME
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: SENSEHUB_USERNAME
      - key: SENSEHUB_PASSWORD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: SENSEHUB_PASSWORD
      - key: SENSEHUB_FARM_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: SENSEHUB_FARM_ID

  # DC305 OneDrive exports: events, inventory, births (per-farm skip if unchanged).
  # If an older manually created "Farm-Dashboard" cron still exists, suspend/delete it
  # after this blueprint job is live to avoid double imports.
  - type: cron
    name: farm-dashboard-import-dc305
    runtime: docker
    schedule: "0 4 * * *"
    dockerCommand: python scripts/import_herd_events.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: GRAPH_TENANT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID
      - key: GRAPH_CLIENT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID
      - key: GRAPH_CLIENT_SECRET
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET
      - key: GRAPH_DRIVE_USER_EMAIL
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_DRIVE_USER_EMAIL
      - key: HERD_EXPORT_BASE_PATH
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: HERD_EXPORT_BASE_PATH

  # Genomic results from OneDrive (weekly — file changes infrequently).
  - type: cron
    name: farm-dashboard-genomic-import
    runtime: docker
    schedule: "0 5 * * 0"
    dockerCommand: python scripts/import_genomic_results.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: GRAPH_TENANT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID
      - key: GRAPH_CLIENT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID
      - key: GRAPH_CLIENT_SECRET
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET
      - key: GRAPH_DRIVE_USER_EMAIL
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_DRIVE_USER_EMAIL
      - key: HERD_EXPORT_BASE_PATH
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: HERD_EXPORT_BASE_PATH

  # Inventory-only OneDrive import (CMINV / GADINV). Runs hourly; each farm is
  # checked independently and skipped when that file's fingerprint is unchanged.
  - type: cron
    name: farm-dashboard-inventory-import
    runtime: docker
    schedule: "20 * * * *"
    dockerCommand: python scripts/import_herd_inventory.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: GRAPH_TENANT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_TENANT_ID
      - key: GRAPH_CLIENT_ID
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_ID
      - key: GRAPH_CLIENT_SECRET
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_CLIENT_SECRET
      - key: GRAPH_DRIVE_USER_EMAIL
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: GRAPH_DRIVE_USER_EMAIL
      - key: HERD_EXPORT_BASE_PATH
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: HERD_EXPORT_BASE_PATH

  # CTS cattle-on-holding sync at 5am UK time.
  # Runs hourly (UTC); the script exits immediately unless Europe/London hour
  # is 5 — so BST/GMT stay correct year-round.
  - type: cron
    name: farm-dashboard-cts-sync
    runtime: docker
    schedule: "10 * * * *"
    dockerCommand: python scripts/sync_cts_holding.py --only-at-uk-hours 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CTS_DDTS_USERNAME
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_DDTS_USERNAME
      - key: CTS_DDTS_PASSWORD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_DDTS_PASSWORD
      - key: CTS_CTWS_USERNAME_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_USERNAME_CM
      - key: CTS_CTWS_PASSWORD_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_PASSWORD_CM
      - key: CTS_HOLDING_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_HOLDING_CM
      - key: CTS_CTWS_USERNAME_GAD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_USERNAME_GAD
      - key: CTS_CTWS_PASSWORD_GAD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_PASSWORD_GAD
      - key: CTS_HOLDING_GAD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_HOLDING_GAD

  # Send pending BCMS movements on their UK reporting deadline day.
  # Render cron is UTC-only, so run at 20:10 and 21:10 UTC: one of those is
  # 9:10pm UK in both BST and GMT. A second same-day run is a no-op after send.
  # No hour gate — Trigger from the dashboard sends immediately.
  - type: cron
    name: farm-dashboard-cts-deadline-send
    runtime: docker
    schedule: "10 20,21 * * *"
    dockerCommand: python scripts/send_cts_deadline_movements.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-dashboard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CTS_DDTS_USERNAME
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_DDTS_USERNAME
      - key: CTS_DDTS_PASSWORD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_DDTS_PASSWORD
      - key: CTS_CTWS_USERNAME_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_USERNAME_CM
      - key: CTS_CTWS_PASSWORD_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_PASSWORD_CM
      - key: CTS_HOLDING_CM
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_HOLDING_CM
      - key: CTS_CTWS_USERNAME_GAD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_USERNAME_GAD
      - key: CTS_CTWS_PASSWORD_GAD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_CTWS_PASSWORD_GAD
      - key: CTS_HOLDING_GAD
        fromService:
          name: farm-dashboard
          type: web
          envVarKey: CTS_HOLDING_GAD

databases:
  - name: farm-dashboard-db
    plan: basic-1gb
    databaseName: farm_dashboard
    user: farm_dashboard
